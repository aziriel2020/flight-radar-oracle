name: Validate Flight Radar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
      - run: terraform -chdir=infra/oci-micro init -backend=false -input=false
      - run: terraform -chdir=infra/oci-micro validate
      - name: Validate Vercel config and browser/serverless JS
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('vercel.json'));if(c.outputDirectory!=='public'||c.framework!==null)process.exit(1)"
          for f in public/app.js api/health.mjs api/deals.mjs; do node --check "$f"; done
          test -f public/index.html
      - run: python -m compileall -q flight_radar
      - run: python -m unittest discover -s tests -v
      - run: python -m flight_radar --db /tmp/flight-radar-ci.sqlite init
      - run: python -m flight_radar --db /tmp/flight-radar-ci.sqlite demo
      - run: python -m flight_radar --db /tmp/flight-radar-ci.sqlite report
