name: Verify live Vercel
on:
  push:
    paths:
      - '.github/workflows/verify-vercel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe public Flight Radar site
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://flight-radar-oracle.vercel.app"
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30              "$target/" -o /tmp/flight-radar-home.html
          grep -qi 'FLIGHT.*RADAR\|Flight Radar' /tmp/flight-radar-home.html
          echo "Homepage: OK"
      - name: Probe serverless health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30              'https://flight-radar-oracle.vercel.app/api/health' -o /tmp/flight-radar-health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/flight-radar-health.json'))
          assert d.get('ok') is True, d
          print('Health: OK',d.get('runtime'))
          PY
      - name: Probe Oracle-generated destination artwork on Vercel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 25 \
            'https://flight-radar-oracle.vercel.app/images/destinations/FCO.svg' -o /tmp/flight-radar-fco.svg
          grep -q '<svg' /tmp/flight-radar-fco.svg
          grep -q 'ROME' /tmp/flight-radar-fco.svg
          echo "Vercel original destination illustration: OK"
      - name: Probe observed market data
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 30              'https://flight-radar-oracle.vercel.app/api/deals' -o /tmp/flight-radar-deals.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/flight-radar-deals.json'))
          assert isinstance(d.get('offers'),list), d
          print('API status:', d.get('status'))
          print('Fresh public observations:', len(d['offers']))
          print('Last scan:',d.get('lastScan'))
          for o in d['offers'][:5]:
              assert o.get('state') in ('observed','verified'), o
              print(o['origin'],'->',o['destination'],o['price_eur'],'EUR',o.get('state'))
          PY
